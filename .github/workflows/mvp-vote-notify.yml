# Every 10 minutes asks ClubCalcetto if the MVP vote of a match has just opened; if so the app
# sends the notification (once). Free for public repositories. Needs two repository secrets:
#   APP_URL      e.g. https://your-app.vercel.app   (no final slash)
#   CRON_SECRET  same value as the CRON_SECRET variable on Vercel
name: Notifica voto MVP

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Controlla apertura voto MVP
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Segreti APP_URL / CRON_SECRET non impostati"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/mvp-vote"
